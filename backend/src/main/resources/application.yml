spring:
  application:
    name: geoshield-backend
  datasource:
    url: ${GEOSHIELD_DB_URL:jdbc:mysql://localhost:3306/geoshield?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${GEOSHIELD_DB_USERNAME:root}
    password: ${GEOSHIELD_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: ${GEOSHIELD_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${GEOSHIELD_JPA_FORMAT_SQL:false}
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC

server:
  address: 0.0.0.0
  forward-headers-strategy: framework
  error:
    include-message: never

geoshield:
  dev-seed:
    enabled: ${GEOSHIELD_DEV_SEED_ENABLED:false}
  security:
    bcrypt-strength: ${GEOSHIELD_BCRYPT_STRENGTH:12}
  jwt:
    secret: ${GEOSHIELD_JWT_SECRET}
    access-token-ttl: ${GEOSHIELD_JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${GEOSHIELD_JWT_REFRESH_TOKEN_TTL:P30D}
  risk:
    historical-incident-weight: ${GEOSHIELD_RISK_HISTORICAL_INCIDENT_WEIGHT:0.30}
    weather-weight: ${GEOSHIELD_RISK_WEATHER_WEIGHT:0.20}
    time-of-day-weight: ${GEOSHIELD_RISK_TIME_OF_DAY_WEIGHT:0.15}
    service-proximity-weight: ${GEOSHIELD_RISK_SERVICE_PROXIMITY_WEIGHT:0.15}
    user-report-weight: ${GEOSHIELD_RISK_USER_REPORT_WEIGHT:0.10}
    connectivity-weight: ${GEOSHIELD_RISK_CONNECTIVITY_WEIGHT:0.05}
    other-context-weight: ${GEOSHIELD_RISK_OTHER_CONTEXT_WEIGHT:0.05}
    low-max: ${GEOSHIELD_RISK_LOW_MAX:39}
    medium-max: ${GEOSHIELD_RISK_MEDIUM_MAX:59}
    high-max: ${GEOSHIELD_RISK_HIGH_MAX:79}
  weather:
    # Open-Meteo is the selected provider for Architecture v3.2 architecture-open item 1.
    # It needs no API key or account, so there is no weather credential to store or rotate.
    # Disabling this makes the weather factor report explicitly unavailable; it never
    # falls back to a synthesized or default weather condition.
    enabled: ${GEOSHIELD_WEATHER_ENABLED:true}
    base-url: ${GEOSHIELD_WEATHER_BASE_URL:https://api.open-meteo.com}
    connect-timeout: ${GEOSHIELD_WEATHER_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${GEOSHIELD_WEATHER_READ_TIMEOUT:PT3S}
  historical-data:
    ingestion:
      enabled: ${GEOSHIELD_HISTORICAL_INGESTION_ENABLED:false}
      morth-source: ${GEOSHIELD_HISTORICAL_MORTH_SOURCE:}
      ncrb-source: ${GEOSHIELD_HISTORICAL_NCRB_SOURCE:}
  news:
    enabled: ${GEOSHIELD_NEWS_ENABLED:false}
    provider: ${GEOSHIELD_NEWS_PROVIDER:gnews}
    api-key: ${GEOSHIELD_NEWS_API_KEY:}
    base-url: ${GEOSHIELD_NEWS_BASE_URL:https://gnews.io/api/v4}
    connect-timeout: ${GEOSHIELD_NEWS_CONNECT_TIMEOUT:PT3S}
    read-timeout: ${GEOSHIELD_NEWS_READ_TIMEOUT:PT5S}
    cache-ttl-minutes: ${GEOSHIELD_NEWS_CACHE_TTL_MINUTES:45}
    cache-max-size: ${GEOSHIELD_NEWS_CACHE_MAX_SIZE:200}
    lookback-hours: ${GEOSHIELD_NEWS_LOOKBACK_HOURS:72}
    max-results: ${GEOSHIELD_NEWS_MAX_RESULTS:10}
    language: ${GEOSHIELD_NEWS_LANGUAGE:en}
    country: ${GEOSHIELD_NEWS_COUNTRY:in}

logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${GEOSHIELD_DB_URL}
    username: ${GEOSHIELD_DB_USERNAME}
    password: ${GEOSHIELD_DB_PASSWORD}

